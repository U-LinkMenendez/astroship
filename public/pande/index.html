<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Pandé Repostería</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="./css/styles.css"
  />

</head>

<body>

  <nav class="navbar">

  <div class="logo">
    Pandé
  </div>

  <div class="cart-btn" id="cart-btn">
    🛒 <span id="cart-count">0</span>
  </div>

</nav>

  <div class="overlay" id="overlay"></div>
  
  <div class="cart-drawer" id="cart-drawer">

  <div class="cart-header">

    <h2>Carrito</h2>

    <button id="close-cart">
      ✕
    </button>

  </div>

  <div id="cart-items"></div>

  <div class="cart-footer">

    <div class="subtotal">
      Total:
      <span id="cart-total">$0</span>
    </div>

    <button class="checkout-btn">
      Finalizar pedido
    </button>

  </div>

</div>
  
  <header>

    <h1>Pandé</h1>

    <div class="sub">
      Repostería artesanal en Mérida
    </div>

  </header>

  <main>

    <div id="productos"></div>

  </main>

  <script src="./js/app.js"></script>

</body>

</html>
